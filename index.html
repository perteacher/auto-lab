<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탐구 그래프 메이커</title>
<meta name="description" content="중학교 과학 탐구 측정값을 입력하면 그래프·추세선·기울기를 바로 그려 주는 도구">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--muted:#667085;--line:#d0d5dd;--accent:#2563eb;--accent2:#e11d48}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:16px;max-width:1100px;margin:0 auto}
header h1{margin:0;font-size:1.4rem}
header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
main{max-width:1100px;margin:0 auto;padding:0 16px 32px;display:grid;grid-template-columns:340px 1fr;gap:16px}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:1rem;margin:0 0 10px}
label{font-size:.85rem;color:var(--muted);display:block;margin:6px 0 2px}
input,select{font:inherit;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border:1px solid var(--line);padding:0}
th{background:#eef2f7;font-size:.82rem;padding:4px}
td input{border:0;border-radius:0;text-align:right}
td.n{width:32px;text-align:center;font-size:.8rem;color:var(--muted)}
td.del button{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 6px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
button.b{font:inherit;font-size:.88rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.b.primary{background:var(--accent);border-color:var(--accent);color:#fff}
canvas{width:100%;height:auto;display:block;border-radius:8px;background:#fff}
.stats{margin-top:10px;font-size:.95rem;line-height:1.6}
.stats b{font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--ink);margin:4px 0}
.chk input{width:auto}
.hint{font-size:.8rem;color:var(--muted);margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:12px}
textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;line-height:1.5;resize:vertical}
.concl{margin-top:12px}
.pred{margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:#fafbfc}
.pred label{margin-top:0}
.predrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.predrow input{width:120px}
#predOut{font-size:.95rem}
#predWarn{margin:6px 0 0}
#predWarn.warn{color:#b45309}
details.axis{margin-top:10px;font-size:.88rem}
details.axis summary{cursor:pointer;color:var(--accent);padding:4px 0}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:820px){
  header{padding:12px 12px 8px}header h1{font-size:1.2rem}
  main{padding:0 10px 24px;gap:10px}
  .card{padding:12px}
  input,select,textarea{font-size:16px;padding:9px 10px}
  td input{padding:10px 8px}
  td.del button{padding:10px 12px;font-size:1rem}
  button.b{padding:10px 14px;font-size:.95rem}
  .row4{grid-template-columns:1fr 1fr}
}
@media (pointer:coarse){input[type=checkbox]{width:20px;height:20px}}
</style>
</head>
<body>
<header>
  <h1>📈 탐구 그래프 메이커</h1>
  <p>측정값을 표에 넣으면 그래프·추세선·기울기가 바로 나와요. 모든 계산은 이 브라우저 안에서만 해요.</p>
</header>
<main>
  <section class="card" aria-label="데이터 입력">
    <h2>1. 실험 정보</h2>
    <label for="example">예시 불러오기</label>
    <select id="example">
      <option value="">— 직접 입력 —</option>
      <option value="hooke">용수철에 매단 추의 무게와 늘어난 길이</option>
      <option value="ohm">전압과 전류 (옴의 법칙)</option>
      <option value="heat">물을 가열할 때 시간과 온도</option>
      <option value="boyle">압력과 기체의 부피 (보일 법칙)</option>
    </select>
    <label for="title">그래프 제목</label>
    <input id="title" value="">
    <div class="row2">
      <div><label for="xname">가로축(독립 변인)</label><input id="xname"></div>
      <div><label for="xunit">단위</label><input id="xunit"></div>
      <div><label for="yname">세로축(종속 변인)</label><input id="yname"></div>
      <div><label for="yunit">단위</label><input id="yunit"></div>
    </div>
    <h2 style="margin-top:14px">2. 측정값</h2>
    <table>
      <thead><tr><th>#</th><th id="thx">x</th><th id="thy">y</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="btns">
      <button class="b" id="addRow">+ 행 추가</button>
      <button class="b" id="clear">모두 지우기</button>
    </div>
    <p class="hint">엑셀에서 두 열을 복사해 표의 첫 칸에 붙여넣어도 돼요.</p>
  </section>
  <section class="card" aria-label="그래프">
    <h2>3. 그래프</h2>
    <div class="btns" style="margin:0 0 8px">
      <label class="chk" for="fitType">추세선</label>
      <select id="fitType" style="width:auto">
        <option value="auto">자동 추천</option>
        <option value="linear">직선 (y = ax + b)</option>
        <option value="prop">정비례 (y = ax)</option>
        <option value="inv">반비례 (y = a/x)</option>
        <option value="quad">2차 곡선 (y = ax² + bx + c)</option>
        <option value="none">없음</option>
      </select>
      <label class="chk"><input type="checkbox" id="optConnect"> 점 잇기</label>
      <label class="chk"><input type="checkbox" id="optOrigin" checked> 원점 포함</label>
    </div>
    <canvas id="cv" width="1000" height="700" role="img" aria-label="측정값 그래프"></canvas>
    <div class="stats" id="stats"></div>
    <div class="pred" id="predBox">
      <label for="predX">추세선으로 예측하기 — 가로축 값을 넣어 보세요</label>
      <div class="predrow"><input id="predX" inputmode="decimal" placeholder="예: 3"><span id="predOut" aria-live="polite"></span></div>
      <p class="hint" id="predWarn"></p>
    </div>
    <details class="axis" id="axisBox">
      <summary>축 범위 직접 정하기</summary>
      <div class="row4">
        <div><label for="xmin">가로 최솟값</label><input id="xmin" inputmode="decimal" placeholder="자동"></div>
        <div><label for="xmax">가로 최댓값</label><input id="xmax" inputmode="decimal" placeholder="자동"></div>
        <div><label for="ymin">세로 최솟값</label><input id="ymin" inputmode="decimal" placeholder="자동"></div>
        <div><label for="ymax">세로 최댓값</label><input id="ymax" inputmode="decimal" placeholder="자동"></div>
      </div>
      <div class="btns"><button class="b" id="axisReset">자동으로 되돌리기</button></div>
      <p class="hint">비워 두면 자동이에요. 추세선을 범위 밖까지 늘려 보고 싶을 때(예측) 최댓값을 크게 잡아 보세요.</p>
    </details>
    <div id="conclBox" class="concl" hidden>
      <label for="concl">보고서용 결과 문장 (자동 초안 — 고쳐 써도 돼요)</label>
      <textarea id="concl" rows="4"></textarea>
      <div class="btns" style="margin-top:6px"><button class="b" id="copyConcl">문장 복사</button><span class="hint" id="copyMsg" aria-live="polite"></span></div>
    </div>
    <div class="btns">
      <button class="b primary" id="png">그래프 PNG 저장</button>
      <button class="b" id="share">공유 링크 복사</button>
    </div>
    <p class="hint" id="shareMsg" aria-live="polite"></p>
    <p class="hint">입력한 내용은 이 기기 브라우저에 자동 저장돼요. 공유 링크를 학생에게 보내면 같은 표·그래프가 그대로 열려요.</p>
  </section>
</main>
<footer>auto-lab · Claude가 만든 실험 도구</footer>
<script>
const EX={
  hooke:{title:'추의 무게와 용수철이 늘어난 길이',xname:'추의 무게',xunit:'N',yname:'늘어난 길이',yunit:'cm',data:[[0,0],[0.5,1.1],[1,2.0],[1.5,3.1],[2,3.9],[2.5,5.1]]},
  ohm:{title:'니크롬선에 걸린 전압과 전류',xname:'전압',xunit:'V',yname:'전류',yunit:'mA',data:[[0,0],[1.5,52],[3,98],[4.5,151],[6,203],[7.5,248]]},
  heat:{title:'물을 가열한 시간과 온도',xname:'시간',xunit:'분',yname:'온도',yunit:'℃',data:[[0,18],[1,26],[2,35],[3,43],[4,52],[5,60],[6,69]]},
  boyle:{title:'압력과 기체의 부피',xname:'압력',xunit:'기압',yname:'부피',yunit:'mL',data:[[1,60],[1.5,40],[2,30],[2.5,24],[3,20],[4,15]]}
};
const $=id=>document.getElementById(id);
const tbody=$('tbody');
function addRow(x='',y=''){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td class="n"></td><td><input inputmode="decimal" aria-label="x 값"></td><td><input inputmode="decimal" aria-label="y 값"></td><td class="del"><button title="행 삭제" aria-label="행 삭제">✕</button></td>`;
  const [ix,iy]=tr.querySelectorAll('input');ix.value=x;iy.value=y;
  tr.querySelector('button').onclick=()=>{tr.remove();renumber();draw()};
  tbody.appendChild(tr);renumber();
}
function renumber(){[...tbody.rows].forEach((r,i)=>r.cells[0].textContent=i+1)}
function getData(){
  const pts=[];
  for(const r of tbody.rows){
    const [ix,iy]=r.querySelectorAll('input');
    const x=parseFloat(ix.value.replace(',','.')),y=parseFloat(iy.value.replace(',','.'));
    if(isFinite(x)&&isFinite(y))pts.push([x,y]);
  }
  return pts;
}
function loadExample(k){
  const e=EX[k];if(!e)return;
  ['xmin','xmax','ymin','ymax','predX'].forEach(i=>$(i).value='');
  ['title','xname','xunit','yname','yunit'].forEach(f=>$(f).value=e[f]);
  tbody.innerHTML='';e.data.forEach(d=>addRow(d[0],d[1]));draw();
}
const FITS={
  linear:{name:'직선',fit(p){
    const n=p.length;if(n<2)return null;let sx=0,sy=0,sxx=0,sxy=0;
    for(const[x,y]of p){sx+=x;sy+=y;sxx+=x*x;sxy+=x*y}
    const d=n*sxx-sx*sx;if(d===0)return null;const a=(n*sxy-sx*sy)/d,b=(sy-a*sx)/n;
    return{a,b,f:x=>a*x+b,eq:`y = ${sig(a)}x${pm(b)}`,slope:a};}},
  prop:{name:'정비례',fit(p){
    let sxx=0,sxy=0;for(const[x,y]of p){sxx+=x*x;sxy+=x*y}
    if(p.length<1||sxx===0)return null;const a=sxy/sxx;
    return{a,f:x=>a*x,eq:`y = ${sig(a)}x`,slope:a};}},
  inv:{name:'반비례',fit(p){
    const q=p.filter(([x])=>x!==0);if(q.length<2||q.length<p.length)return null;
    let suu=0,suy=0;for(const[x,y]of q){suu+=1/(x*x);suy+=y/x}
    const a=suy/suu;return{a,f:x=>x===0?NaN:a/x,eq:`y = ${sig(a)} / x`,xy:a};}},
  quad:{name:'2차 곡선',fit(p){
    if(p.length<3)return null;let S=[0,0,0,0,0],T=[0,0,0];
    for(const[x,y]of p){let xp=1;for(let k=0;k<5;k++){S[k]+=xp;if(k<3)T[k]+=xp*y;xp*=x}}
    const M=[[S[4],S[3],S[2],T[2]],[S[3],S[2],S[1],T[1]],[S[2],S[1],S[0],T[0]]];
    for(let i=0;i<3;i++){let mx=i;for(let r=i+1;r<3;r++)if(Math.abs(M[r][i])>Math.abs(M[mx][i]))mx=r;[M[i],M[mx]]=[M[mx],M[i]];
      if(Math.abs(M[i][i])<1e-12)return null;for(let r=0;r<3;r++)if(r!==i){const f=M[r][i]/M[i][i];for(let c=i;c<4;c++)M[r][c]-=f*M[i][c]}}
    const a=M[0][3]/M[0][0],b=M[1][3]/M[1][1],c=M[2][3]/M[2][2];
    return{a,b,c,f:x=>a*x*x+b*x+c,eq:`y = ${sig(a)}x²${pm(b,'x')}${pm(c)}`};}}
};
function pm(v,s=''){if(Math.abs(v)<1e-12)return '';return (v<0?' − ':' + ')+sig(Math.abs(v))+s}
function r2(p,f){let my=0;for(const[,y]of p)my+=y;my/=p.length;let ssr=0,sst=0;
  for(const[x,y]of p){ssr+=(y-f(x))**2;sst+=(y-my)**2}return sst===0?1:1-ssr/sst}
function doFit(type,p){const r=FITS[type].fit(p);if(!r)return null;r.type=type;r.r2=r2(p,r.f);return r}
function autoFit(p){
  // 단순한 모델 우선: 2차는 다른 모델보다 R²가 확실히 좋을 때만
  const c=['prop','linear','inv'].map(t=>doFit(t,p)).filter(Boolean);
  let best=null;for(const r of c){if(!best||r.r2>best.r2+0.01)best=r}
  const q=doFit('quad',p);if(q&&(!best||q.r2>best.r2+0.02))best=q;
  return best;
}
function nice(span){
  const raw=span/6,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;
  return (f<1.5?1:f<3?2:f<7?5:10)*p;
}
function fmt(v,step){
  const dec=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return (+v.toFixed(Math.min(dec,6))).toString();
}
function sig(v){if(!isFinite(v))return '-';return Math.abs(v)>=1000||Math.abs(v)<0.001&&v!==0?v.toExponential(3):(+v.toPrecision(4)).toString()}
function axisLabel(n,u){return u?`${n} (${u})`:n}
function num(id){const v=parseFloat($(id).value.replace(',','.'));return isFinite(v)?v:null}
function range(vals,incl0,mlo,mhi){
  if(mlo!==null&&mhi!==null&&mhi>mlo){const st=nice(mhi-mlo);return{lo:mlo,hi:mhi,st,manual:true}}
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(mlo!==null){lo=mlo;incl0=false}if(mhi!==null){hi=mhi;incl0=false}
  if(lo>hi)[lo,hi]=[hi,lo];
  if(incl0){lo=Math.min(lo,0);hi=Math.max(hi,0)}
  if(lo===hi){lo-=1;hi+=1}
  const st=nice(hi-lo);
  let L=Math.floor(lo/st)*st,H=Math.ceil(hi/st)*st;
  // 점이 테두리에 걸치지 않도록 여백 한 칸 (단, 0 경계는 유지)
  if(mhi===null&&H-hi<st*0.05&&hi!==0)H+=st;
  if(mlo===null&&lo-L<st*0.05&&lo!==0)L-=st;
  if(mlo!==null)L=mlo;if(mhi!==null)H=mhi;
  return{lo:L,hi:H,st};
}
function fitCanvas(force){
  // 좁은 화면에서는 캔버스 해상도를 낮춰 글자가 상대적으로 커 보이게 함
  const cv=$('cv'),cw=cv.clientWidth||1000;
  const [w,h]=force||(cw<560?[640,560]:[1000,700]);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
}
function draw(){
  fitCanvas();drawOn();scheduleSave();
}
// ---- 상태 저장·공유 ----
const TXT=['title','xname','xunit','yname','yunit','fitType','xmin','xmax','ymin','ymax','predX'],CHK=['optConnect','optOrigin'];
const SKEY='auto-lab-graph-v1';
function getState(){
  const st={v:1,d:[]};TXT.forEach(i=>{if($(i).value!=='')st[i]=$(i).value});CHK.forEach(i=>st[i]=$(i).checked?1:0);
  for(const r of tbody.rows){const [ix,iy]=r.querySelectorAll('input');if(ix.value!==''||iy.value!=='')st.d.push([ix.value,iy.value])}
  return st;
}
function setState(st){
  if(!st||!Array.isArray(st.d))return false;
  TXT.forEach(i=>{$(i).value=st[i]!=null?String(st[i]):(i==='fitType'?'auto':'')});
  if(!$('fitType').value)$('fitType').value='auto';
  CHK.forEach(i=>{if(st[i]!=null)$(i).checked=!!+st[i]});
  tbody.innerHTML='';st.d.slice(0,200).forEach(r=>addRow(String(r[0]??''),String(r[1]??'')));
  for(let i=st.d.length;i<5;i++)addRow();
  $('example').value='';return true;
}
function encState(st){const b=new TextEncoder().encode(JSON.stringify(st));let s='';b.forEach(c=>s+=String.fromCharCode(c));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decState(t){const s=atob(t.replace(/-/g,'+').replace(/_/g,'/'));return JSON.parse(new TextDecoder().decode(Uint8Array.from(s,c=>c.charCodeAt(0))))}
let svT,ready=false,sharing=false;
function scheduleSave(){if(!ready)return;
  // 링크로 연 뒤 고치기 시작하면 주소의 옛 데이터를 지워 새로고침 때 수정 내용이 덮이지 않게
  if(/[#&]d=/.test(location.hash)&&!sharing)history.replaceState(null,'',location.pathname+location.search);
  clearTimeout(svT);svT=setTimeout(()=>{try{localStorage.setItem(SKEY,JSON.stringify(getState()))}catch(e){}},300)}
function restore(){
  const m=location.hash.match(/[#&]d=([\w-]+)/);
  if(m){try{if(setState(decState(m[1]))){$('shareMsg').textContent='공유 링크의 데이터를 불러왔어요';return true}}catch(e){$('shareMsg').textContent='링크 데이터를 읽지 못했어요'}}
  try{const raw=localStorage.getItem(SKEY);if(raw&&setState(JSON.parse(raw))){$('shareMsg').textContent='지난번 입력을 이어서 불러왔어요';return true}}catch(e){}
  return false;
}
function drawOn(){
  const cv=$('cv'),c=cv.getContext('2d'),W=cv.width,H=cv.height;
  const pts=getData();
  const xn=$('xname').value||'x',yn=$('yname').value||'y';
  $('thx').textContent=axisLabel(xn,$('xunit').value);$('thy').textContent=axisLabel(yn,$('yunit').value);
  c.fillStyle='#fff';c.fillRect(0,0,W,H);
  const sm=W<1000,L=sm?92:110,R=sm?24:40,T=sm?62:70,B=sm?92:100,pw=W-L-R,ph=H-T-B;
  c.fillStyle='#1d2330';c.textAlign='center';
  const tt=$('title').value||'';let tf=30;c.font=`bold ${tf}px system-ui,sans-serif`;
  while(tf>16&&c.measureText(tt).width>W-20){tf-=2;c.font=`bold ${tf}px system-ui,sans-serif`}
  c.fillText(tt,W/2,42);
  if(pts.length===0){c.font='24px system-ui,sans-serif';c.fillStyle='#667085';c.fillText('측정값을 입력하세요',W/2,H/2);$('stats').innerHTML='';return}
  const inc=$('optOrigin').checked;
  const rx=range(pts.map(p=>p[0]),inc,num('xmin'),num('xmax')),ry=range(pts.map(p=>p[1]),inc,num('ymin'),num('ymax'));
  const X=v=>L+(v-rx.lo)/(rx.hi-rx.lo)*pw,Y=v=>T+ph-(v-ry.lo)/(ry.hi-ry.lo)*ph;
  c.lineWidth=1;c.font='20px system-ui,sans-serif';
  for(let v=Math.ceil(rx.lo/rx.st-1e-9)*rx.st;v<=rx.hi+rx.st*1e-6;v+=rx.st){
    c.strokeStyle='#e5e7eb';c.beginPath();c.moveTo(X(v),T);c.lineTo(X(v),T+ph);c.stroke();
    c.fillStyle='#475467';c.textAlign='center';c.fillText(fmt(v,rx.st),X(v),T+ph+28);
  }
  for(let v=Math.ceil(ry.lo/ry.st-1e-9)*ry.st;v<=ry.hi+ry.st*1e-6;v+=ry.st){
    c.strokeStyle='#e5e7eb';c.beginPath();c.moveTo(L,Y(v));c.lineTo(L+pw,Y(v));c.stroke();
    c.fillStyle='#475467';c.textAlign='right';c.fillText(fmt(v,ry.st),L-10,Y(v)+7);
  }
  c.strokeStyle='#1d2330';c.lineWidth=2;c.strokeRect(L,T,pw,ph);
  c.fillStyle='#1d2330';c.font='bold 22px system-ui,sans-serif';c.textAlign='center';
  c.fillText(axisLabel(xn,$('xunit').value),L+pw/2,H-30);
  c.save();c.translate(30,T+ph/2);c.rotate(-Math.PI/2);c.fillText(axisLabel(yn,$('yunit').value),0,0);c.restore();
  c.save();c.beginPath();c.rect(L,T,pw,ph);c.clip();
  if($('optConnect').checked){
    const s=[...pts].sort((a,b)=>a[0]-b[0]);
    c.strokeStyle='#94a3b8';c.lineWidth=2;c.beginPath();s.forEach((p,i)=>i?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1])));c.stroke();
  }
  const ft=$('fitType').value;
  const reg=ft==='none'?null:ft==='auto'?autoFit(pts):doFit(ft,pts);
  if(reg){
    c.strokeStyle='#e11d48';c.lineWidth=3;c.setLineDash([12,8]);c.beginPath();let pen=false;
    for(let i=0;i<=400;i++){const x=rx.lo+(rx.hi-rx.lo)*i/400,y=reg.f(x);
      if(!isFinite(y)||Math.abs(Y(y))>1e5){pen=false;continue}
      pen?c.lineTo(X(x),Y(y)):c.moveTo(X(x),Y(y));pen=true}
    c.stroke();c.setLineDash([]);
  }
  c.restore();
  let out=0;
  for(const[x,y]of pts){if(x<rx.lo||x>rx.hi||y<ry.lo||y>ry.hi){out++;continue}c.fillStyle='#2563eb';c.beginPath();c.arc(X(x),Y(y),8,0,Math.PI*2);c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke()}
  drawPred(c,reg,pts,X,Y,rx,ry,L,T,pw,ph);
  let h=`측정값 <b>${pts.length}</b>개`+(out?` <span class="hint">(축 범위 밖 ${out}개는 안 보여요)</span>`:'');
  if(reg){
    const yu=$('yunit').value,xu=$('xunit').value;
    h+=`<br>추세선(${FITS[reg.type].name}${ft==='auto'?', 자동 추천':''}): <b>${reg.eq}</b>`;
    if(reg.slope!==undefined)h+=`<br>기울기: <b>${sig(reg.slope)}${yu&&xu?` ${yu}/${xu}`:''}</b>`;
    if(reg.xy!==undefined)h+=`<br>x × y ≈ <b>${sig(reg.xy)}</b> (일정)`;
    h+=` &nbsp; 결정계수 R²: <b>${reg.r2.toFixed(3)}</b>`;
    h+=`<br><span class="hint">R²가 1에 가까울수록 점들이 추세선에 가깝게 모여 있다는 뜻이에요.</span>`;
  }else if(ft!=='none'){
    h+=`<br><span class="hint">이 추세선을 계산할 수 없어요. (점 개수가 부족하거나, 반비례인데 x=0이 있어요)</span>`;
  }
  $('stats').innerHTML=h;
  writeConclusion(pts,reg);
}
function drawPred(c,reg,pts,X,Y,rx,ry,L,T,pw,ph){
  const out=$('predOut'),warn=$('predWarn');warn.className='hint';warn.textContent='';out.innerHTML='';
  const px=num('predX');
  if(px===null)return;
  if(!reg){out.textContent='추세선이 있어야 예측할 수 있어요.';return}
  const py=reg.f(px);
  if(!isFinite(py)){out.textContent='이 값에서는 계산할 수 없어요.';return}
  const yu=$('yunit').value,xu=$('xunit').value,yn=$('yname').value||'y';
  out.innerHTML=`→ ${yn} ≈ <b>${sig(py)}${yu?' '+yu:''}</b>`;
  const xs=pts.map(p=>p[0]),lo=Math.min(...xs),hi=Math.max(...xs);
  if(px<lo||px>hi){warn.className='hint warn';warn.textContent=`⚠ 측정한 범위(${sig(lo)}~${sig(hi)}${xu?' '+xu:''}) 밖이라 '외삽'이에요. 이 범위 밖에서도 같은 관계가 계속된다고 가정한 값이라 실제와 다를 수 있어요.`}
  else warn.textContent='측정한 범위 안의 값이라(내삽) 비교적 믿을 만해요.';
  if(px<rx.lo||px>rx.hi||py<ry.lo||py>ry.hi){warn.textContent+=' (그래프 범위 밖이라 점은 안 보여요. 축 범위를 늘려 보세요.)';return}
  c.save();c.strokeStyle='#f59e0b';c.lineWidth=2;c.setLineDash([6,6]);c.beginPath();
  c.moveTo(X(px),T+ph);c.lineTo(X(px),Y(py));c.lineTo(L,Y(py));c.stroke();c.setLineDash([]);
  c.fillStyle='#f59e0b';c.beginPath();const k=X(px),m=Y(py);c.moveTo(k,m-11);c.lineTo(k+11,m);c.lineTo(k,m+11);c.lineTo(k-11,m);c.closePath();c.fill();
  c.strokeStyle='#fff';c.lineWidth=2;c.stroke();c.restore();
}
// 변인 이름에 따라 자연스러운 서술어 고르기
const VERBS=[
  [/시간|시각|기간/,['지날수록','지날 때마다','늘어난다','줄어든다']],
  [/온도|기온|수온/,['높을수록','높아질 때마다','높아진다','낮아진다']],
  [/길이|거리|높이|깊이|변위/,['길수록','길어질 때마다','길어진다','짧아진다']],
  [/속력|속도|빠르기/,['빠를수록','빨라질 때마다','빨라진다','느려진다']],
  [/무게|질량/,['무거울수록','무거워질 때마다','무거워진다','가벼워진다']],
  [/개수|수$|횟수|부피|넓이|면적|양$/,['많을수록','늘어날 때마다','늘어난다','줄어든다']]
];
function verbs(n){for(const[re,v]of VERBS)if(re.test(n))return v;return['커질수록','커질 때마다','커진다','작아진다']}
function writeConclusion(pts,reg){
  const box=$('concl');
  const xn=$('xname').value||'x',yn=$('yname').value||'y',xu=$('xunit').value,yu=$('yunit').value;
  if(pts.length<3||!reg){box.value='';$('conclBox').hidden=true;return}
  $('conclBox').hidden=false;
  const s=[...pts].sort((a,b)=>a[0]-b[0]);
  const up=s[s.length-1][1]>s[0][1];
  const 은=w=>{const ch=w.charCodeAt(w.length-1);return (ch>=0xAC00&&ch<=0xD7A3&&(ch-0xAC00)%28)?'은':'는'};
  const 이=w=>{const ch=w.charCodeAt(w.length-1);return (ch>=0xAC00&&ch<=0xD7A3&&(ch-0xAC00)%28)?'이':'가'};
  const 와=w=>{const ch=w.charCodeAt(w.length-1);return (ch>=0xAC00&&ch<=0xD7A3&&(ch-0xAC00)%28)?'과':'와'};
  const vx=verbs(xn),vy=verbs(yn);
  let t=`${xn}${이(xn)} ${vx[0]} ${yn}${은(yn)} ${up?vy[2]:vy[3]}.`;
  const fit=reg.r2>=0.95?'잘 맞는':reg.r2>=0.8?'대체로 맞는':'잘 맞지 않는';
  if(reg.type==='prop')t+=` 그래프가 원점을 지나는 직선에 가까우므로 ${xn}${와(xn)} ${yn}${은(yn)} 정비례 관계라고 볼 수 있다.`;
  else if(reg.type==='linear')t+=` 그래프는 직선 모양이다.`;
  else if(reg.type==='inv')t+=` 두 값을 곱한 값이 약 ${sig(reg.xy)} 정도로 거의 일정하므로 ${xn}${와(xn)} ${yn}${은(yn)} 반비례 관계라고 볼 수 있다.`;
  else if(reg.type==='quad')t+=` 그래프는 직선이 아닌 곡선 모양이다.`;
  if(reg.slope!==undefined)t+=` ${xn}${이(xn)} 1${xu?' '+xu:''} ${vx[1]} ${yn}${은(yn)} 약 ${sig(Math.abs(reg.slope))}${yu?' '+yu:''}씩 ${reg.slope>=0?vy[2]:vy[3]}.`;
  t+=` (추세선 ${reg.eq}, 결정계수 R² = ${reg.r2.toFixed(3)}: 측정값과 ${fit} 편)`;
  box.value=t;
}

  const t=e.clipboardData.getData('text');if(!/[\t\n]/.test(t))return;
  e.preventDefault();
  const rows=t.trim().split(/\r?\n/).map(l=>l.split(/\t|,(?=\s*-?\d)|\s+/).filter(Boolean));
  tbody.innerHTML='';rows.forEach(r=>addRow(r[0]??'',r[1]??''));draw();
});
